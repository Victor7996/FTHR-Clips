<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>FTHR Clips - Save Clip Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2d2d2d;
            color: #e0e0e0;
            font-size: 11px;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        .sdpi-item {
            margin-bottom: 12px;
        }
        .sdpi-item-label {
            font-weight: 600;
            color: #9e9e9e;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        select, input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 11px;
            outline: none;
            transition: border-color 0.15s ease;
        }
        select:focus, input[type="number"]:focus {
            border-color: #00d26a;
        }
        .hint {
            color: #888888;
            font-size: 9px;
            margin-top: 4px;
            line-height: 1.3;
        }
        .custom-row {
            margin-top: 6px;
            display: none;
        }
        .badge {
            display: inline-block;
            background: rgba(0, 210, 106, 0.15);
            color: #00d26a;
            border: 1px solid rgba(0, 210, 106, 0.3);
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 8px;
            font-weight: bold;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="sdpi-item">
        <div class="sdpi-item-label">Clip Duration <span class="badge">v2.0</span></div>
        <select id="durationSelect" onchange="onSelectChanged()">
            <option value="0">Default (from FTHR Settings)</option>
            <option value="15">15 seconds</option>
            <option value="30">30 seconds</option>
            <option value="45">45 seconds</option>
            <option value="60">60 seconds (1 min)</option>
            <option value="120">120 seconds (2 min)</option>
            <option value="300">300 seconds (5 min)</option>
            <option value="600">600 seconds (10 min)</option>
            <option value="900">900 seconds (15 min)</option>
            <option value="1800">1800 seconds (30 min)</option>
            <option value="custom">Custom seconds...</option>
        </select>
        <div id="customRow" class="custom-row">
            <input type="number" id="customInput" min="1" max="1800" placeholder="Duration in seconds" oninput="onCustomInput()" />
        </div>
        <div class="hint">
            In FTHR Clips v2.0, you can place multiple Save Clip buttons with different lengths (e.g., 30s for quick highlights and 5m for full rounds).
        </div>
    </div>

    <script>
        let websocket = null;
        let uuid = null;
        let actionInfo = null;
        let settings = {};

        function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
            uuid = inPropertyInspectorUUID;
            try {
                actionInfo = JSON.parse(inActionInfo);
                settings = actionInfo.payload && actionInfo.payload.settings ? actionInfo.payload.settings : {};
            } catch (e) {
                settings = {};
            }

            websocket = new WebSocket('ws://127.0.0.1:' + inPort);

            websocket.onopen = function () {
                websocket.send(JSON.stringify({
                    event: inRegisterEvent,
                    uuid: inPropertyInspectorUUID
                }));
                initUI();
            };

            websocket.onmessage = function (evt) {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.event === 'didReceiveSettings') {
                        settings = msg.payload.settings || {};
                        initUI();
                    }
                } catch (e) {}
            };
        }

        function initUI() {
            const sec = parseInt(settings.duration_seconds || 0, 10);
            const select = document.getElementById('durationSelect');
            const customRow = document.getElementById('customRow');
            const customInput = document.getElementById('customInput');

            const standard = ['0', '15', '30', '45', '60', '120', '300', '600', '900', '1800'];
            if (standard.includes(String(sec))) {
                select.value = String(sec);
                customRow.style.display = 'none';
            } else if (sec > 0) {
                select.value = 'custom';
                customRow.style.display = 'block';
                customInput.value = sec;
            } else {
                select.value = '0';
                customRow.style.display = 'none';
            }
        }

        function saveSettings(durationSec) {
            settings.duration_seconds = parseInt(durationSec, 10) || 0;
            if (websocket && websocket.readyState === 1) {
                websocket.send(JSON.stringify({
                    event: 'setSettings',
                    context: uuid,
                    payload: settings
                }));
                websocket.send(JSON.stringify({
                    event: 'sendToPlugin',
                    action: actionInfo ? actionInfo.action : 'com.fthrclips.streamdeck.clip',
                    context: uuid,
                    payload: settings
                }));
            }
        }

        function onSelectChanged() {
            const val = document.getElementById('durationSelect').value;
            const customRow = document.getElementById('customRow');
            if (val === 'custom') {
                customRow.style.display = 'block';
                const customVal = document.getElementById('customInput').value || 30;
                saveSettings(customVal);
            } else {
                customRow.style.display = 'none';
                saveSettings(val);
            }
        }

        function onCustomInput() {
            const val = document.getElementById('customInput').value;
            if (val && parseInt(val, 10) > 0) {
                saveSettings(val);
            }
        }
    </script>
</body>
</html>
